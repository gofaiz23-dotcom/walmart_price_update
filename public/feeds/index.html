<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Walmart feed status</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/hub-ui.css" />
  <link rel="stylesheet" href="/walmart-prices/price.css" />
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <h1>Feed status</h1>
        <p>Saved Walmart price-feed ids and the last status checked for each one.</p>
      </div>
      <nav class="top-nav" aria-label="Sections">
        <a href="/walmart-prices/">Home</a>
      </nav>
    </div>
  </header>

  <main class="price-main">
    <section class="price-panel">
      <div class="toolbar price-toolbar">
        <p class="meta" id="feedStatusNote">Saved feed ids appear here. Use Fetch on a row to check that feed only.</p>
        <label class="meta token-label" id="tokenLabel" hidden>Admin token
          <input id="adminToken" type="password" autocomplete="off" />
        </label>
      </div>
      <p class="banner" id="banner" hidden></p>
      <div class="table-wrap">
        <table class="price-table feed-table">
          <thead>
            <tr>
              <th>Status</th>
              <th>Feed id</th>
              <th>Received</th>
              <th>Succeeded</th>
              <th>Failed</th>
              <th>Processing</th>
              <th>Saved</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="feedRows"></tbody>
        </table>
      </div>
    </section>
  </main>
  <script type="module" src="/walmart-prices/feeds.js"></script>
</body>
</html>
